<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient / Glow -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Ring Multi-Stop Gradient -->
    <linearGradient id="ringGrad" x1="15%" y1="85%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="25%" stop-color="#8b5cf6"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="80%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Left N Pillar Gradient -->
    <linearGradient id="nPillarLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Right N Pillar Gradient -->
    <linearGradient id="nPillarRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Diagonal N Wave Gradient -->
    <linearGradient id="nWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Antenna Rod Gradient -->
    <linearGradient id="rodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="40%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadowUnderCircle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Clean Base Canvas -->
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- Soft Shadow under circular emblem -->
  <ellipse cx="256" cy="365" rx="100" ry="10" fill="#64748b" opacity="0.35" filter="url(#subtleBlur)"/>

  <!-- Outer Gradient Ring -->
  <circle cx="256" cy="208" r="132" fill="none" stroke="url(#ringGrad)" stroke-width="26" filter="url(#shadowUnderCircle)"/>

  <!-- Center Stylized Letter "N" -->
  <g id="letter-N">
    <!-- Left Vertical Stem with 3D curve -->
    <path d="M 158 138 
             C 158 135, 161 132, 165 132 
             L 204 132 
             C 207 132, 210 135, 210 138 
             L 210 278 
             C 210 282, 207 285, 204 285 
             L 165 285 
             C 161 285, 158 282, 158 278 
             Z" 
          fill="url(#nPillarLeft)"/>
    
    <!-- Left Stem Wave highlight -->
    <path d="M 158 180 
             C 175 195, 195 185, 210 200 
             L 210 278 
             C 210 282, 207 285, 204 285 
             L 165 285 
             C 161 285, 158 282, 158 278 
             Z" 
          fill="#1e3a8a" opacity="0.45"/>

    <!-- Right Vertical Stem -->
    <path d="M 302 138 
             C 302 135, 305 132, 308 132 
             L 348 132 
             C 352 132, 355 135, 355 138 
             L 355 278 
             C 355 282, 352 285, 348 285 
             L 308 285 
             C 305 285, 302 282, 302 278 
             Z" 
          fill="url(#nPillarRight)"/>

    <!-- Right Stem Wave highlight -->
    <path d="M 302 170 
             C 320 185, 340 175, 355 190 
             L 355 278 
             C 355 282, 352 285, 348 285 
             L 308 285 
             C 305 285, 302 282, 302 278 
             Z" 
          fill="#0284c7" opacity="0.35"/>

    <!-- 3D Fluid Wave Ribbon Connecting N -->
    <path d="M 175 134 
             C 210 145, 250 200, 310 282 
             L 345 282 
             C 290 200, 240 145, 185 134 
             Z" 
          fill="url(#nWaveGrad)"/>
    <path d="M 190 150 
             C 235 195, 275 240, 315 282 
             L 285 282 
             C 245 235, 205 190, 175 150 
             Z" 
          fill="#38bdf8" opacity="0.3"/>
  </g>

  <!-- Upper Right Monogram/Symbol (Stylized "2" / swirl) -->
  <g transform="translate(262, 100)">
    <!-- Elegant stylized blue monogram -->
    <path d="M 14 16 
             C 10 8, 18 2, 28 4 
             C 38 6, 44 14, 38 24 
             C 34 30, 22 36, 14 42 
             C 22 40, 34 40, 42 42 
             M 24 18 
             C 28 28, 38 34, 44 42" 
          fill="none" 
          stroke="#2563eb" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Diagonal Antenna / Slash Rod crossing through circle -->
  <g id="antenna-slash">
    <!-- Main Diagonal Rod (Emerald to Violet) -->
    <line x1="135" y1="62" x2="366" y2="355" 
          stroke="url(#rodGrad)" 
          stroke-width="24" 
          stroke-linecap="round"/>

    <!-- Antenna Tip Ball -->
    <circle cx="145" cy="74" r="8" fill="#10b981"/>

    <!-- Wi-Fi / Wireless Signal Broadcast Arcs at Top-Left Tip -->
    <path d="M 116 80 C 104 64, 110 38, 134 26 C 146 20, 156 22, 164 26" 
          fill="none" 
          stroke="#10b981" 
          stroke-width="8" 
          stroke-linecap="round"/>
    <path d="M 126 92 C 120 80, 124 64, 138 56 C 146 52, 154 54, 160 58" 
          fill="none" 
          stroke="#10b981" 
          stroke-width="7" 
          stroke-linecap="round"/>
    <circle cx="145" cy="74" r="4" fill="#ffffff"/>
  </g>

  <!-- Typography: "Nali Mobile" -->
  <g id="branding-text">
    <!-- "Nali" in vibrant crimson red script -->
    <text x="110" y="435" 
          font-family="'Brush Script MT', 'Segoe Script', 'Great Vibes', 'Caveat', cursive, sans-serif" 
          font-size="68" 
          font-weight="bold" 
          font-style="italic" 
          fill="#e11d48" 
          letter-spacing="1">
      <tspan fill="#1e293b">N</tspan><tspan fill="#e11d48">ali</tspan>
    </text>

    <!-- Stylized "M" for Mobile: Polygon wings -->
    <g transform="translate(216, 388)">
      <!-- Left Wing (Green) -->
      <polygon points="0,48 18,8 38,48" fill="#10b981"/>
      <polygon points="18,8 38,48 24,48" fill="#059669"/>
      <!-- Right Wing (Dark Charcoal) -->
      <polygon points="40,48 60,8 80,48" fill="#334155"/>
      <polygon points="60,8 80,48 68,48" fill="#1e293b"/>
      <!-- Inner negative apex -->
      <polygon points="32,48 39,26 46,48" fill="#ffffff"/>
    </g>

    <!-- "obile" in crisp emerald green -->
    <text x="305" y="435" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" 
          font-size="52" 
          font-weight="800" 
          fill="#10b981" 
          letter-spacing="-1">
      obile
    </text>
  </g>
</svg>