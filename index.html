    <script>
      // Professional resilient error filter: Intercepts benign WebSocket/HMR disconnect messages
      // native to container reverse proxies before they surface as unhandled rejections or error overlays.
      (function() {
        function isBenignWsError(err) {
          if (!err) return false;
          var str = '';
          try {
            if (typeof err === 'string') str = err;
            else if (err && err.message) str = err.message;
            else if (err && err.reason) str = typeof err.reason === 'string' ? err.reason : (err.reason.message || '');
            else str = String(err);
          } catch(e) { str = ''; }
          return /websocket/i.test(str) || /failed to connect to websocket/i.test(str) || /WebSocket closed/i.test(str);
        }

        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isBenignWsError(arguments[i])) return;
          }
          origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isBenignWsError(arguments[i])) return;
          }
          origWarn.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(e) {
          if (isBenignWsError(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('error', function(e) {
          if (isBenignWsError(e.message) || isBenignWsError(e.error)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);
      })();
    </script>

    <div id="root">

    <script>
      // Synchronously bootstrap server-side Supabase credentials to all connected devices (iPad, Mobile, Desktop)
      try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/supabase-config', false);
        xhr.send(null);
        if (xhr.status === 200) {
          var cfg = JSON.parse(xhr.responseText);
          if (cfg && cfg.isConfigured && cfg.supabaseUrl && cfg.supabaseAnonKey) {
            localStorage.setItem('nali_supabase_url', cfg.supabaseUrl);
            localStorage.setItem('nali_supabase_anon_key', cfg.supabaseAnonKey);
            window.__SUPABASE_SERVER_CONFIG__ = cfg;
          }
        }
      } catch (e) {
        console.warn('Config bootstrap notice:', e);
      }
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.log('SW notice:', err);
          });
        });
      }
    </script>
